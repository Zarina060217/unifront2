<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="navbar-container">
            <div class="logo">Formula1</div>
            <nav>
                <ul class="nav-links">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Drivers</a></li>
                    <li><a href="#">Teams</a></li>
                    <li><a href="#">Grand Prix</a></li>
                </ul>
            </nav>
        </header>

        <section class="card-section">
            <div class="card-container">
                <div class="card">
                    <img src="mercedes.jpg" alt="card image">
                    <div class="card-body">
                        <h3>Mercedes F1</h3>
                        <p>All it takes, is all of us</p>
                        <button style="background-color: #00a19b ;">Button</button>
                    </div>
                </div>

                <div class="card">
                    <img src="redbull.jpg" alt="card image">
                    <div class="card-body">
                        <h3>Red Bull F1</h3>
                        <p>Red Bull gives you wings</p>
                        <button style="background-color: #FDD900 ;">Button</button>
                    </div>
                </div>

                <div class="card">
                    <img src="ferrari.jpg" alt="card image">
                    <div class="card-body">
                        <h3>Ferrari F1</h3>
                        <p>Essere Ferrari</p>
                        <button style="background-color:#dc0000;">Button</button>
                    </div>
                </div>
            </div>
        </section>
    </body>
</html>
